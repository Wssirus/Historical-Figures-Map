  // 实体识别：先长后短，命中即占位，避免「司马」误配「司马懿」
  function qaEntities(q) {
    const cands = [];
    PEOPLE.forEach(p => {
      cands.push({ kind: 'person', id: p.id, label: p.name, term: p.name });
      if (p.zi) cands.push({ kind: 'person', id: p.id, label: p.name, term: p.zi });
    });
    FAMILIES.forEach(f => cands.push({ kind: 'family', id: f.id, label: f.name, term: f.name }));
    cands.sort((a, b) => b.term.length - a.term.length);

    const used = new Array(q.length).fill(false);
    const hits = [];
    cands.forEach(c => {
      for (let i = q.indexOf(c.term); i !== -1; i = q.indexOf(c.term, i + 1)) {
        let ok = true;
        for (let k = i; k < i + c.term.length; k++) { if (used[k]) { ok = false; break; } }
        if (!ok) continue;
        for (let k = i; k < i + c.term.length; k++) used[k] = true;
        hits.push({ kind: c.kind, id: c.id, label: c.label, idx: i });
        break;
      }
    });
    hits.sort((a, b) => a.idx - b.idx);
    const seen = new Set(), out = [];
    hits.forEach(h => { if (!seen.has(h.id)) { seen.add(h.id); out.push(h); } });
    return out;
  }

  function qaSnippet(p, kw) {
    const d = p.desc || '';
    const i = d.indexOf(kw);
    if (i === -1) return d.slice(0, 44) + (d.length > 44 ? '…' : '');
    const s = Math.max(0, i - 12);
    return (s > 0 ? '…' : '') + d.slice(s, s + 50) + (s + 50 < d.length ? '…' : '');
  }

  // 世系推算：沿「父子 / 祖孙」链找共同祖先，换算成曾祖、从兄弟等称谓
  function qaGender(p) {
    if (!p) return 'm';
    if (['xie_daoyun', 'yu_wenjun', 'yang_xianrong'].indexOf(p.id) !== -1) return 'f';
    if (/皇后|公主|太后|妻/.test(p.title || '')) return 'f';
    return 'm';
  }

  function qaParentMap(famId) {
    const map = new Map();
    RELATIONS.forEach(r => {
      if (r.type !== 'kin') return;
      const a = QP.get(r.a), b = QP.get(r.b);
      if (!a || !b || a.family !== famId || b.family !== famId) return;
      const s = r.label || '';
      if (!/^(养|族|继)?父(子|女)/.test(s) && !/祖孙|曾祖孙/.test(s)) return;
      const par = a.gen < b.gen ? a : b;
      const ch = a.gen < b.gen ? b : a;
      if (par.gen === ch.gen) return;
      if (!map.has(ch.id)) map.set(ch.id, { id: par.id, w: Math.max(1, ch.gen - par.gen) });
    });
    return map;
  }

  function qaAncestors(id, parentMap) {
    const res = new Map();
    res.set(id, { dist: 0, path: [id] });
    const stack = [{ id: id, dist: 0, path: [id] }];
    while (stack.length) {
      const cur = stack.pop();
      const p = parentMap.get(cur.id);
      if (!p) continue;
      const nd = cur.dist + p.w;
      const np = cur.path.concat(p.id);
      const old = res.get(p.id);
      if (old && old.dist <= nd) continue;
      res.set(p.id, { dist: nd, path: np });
      stack.push({ id: p.id, dist: nd, path: np });
    }
    return res;
  }

  function qaKinTerms(upA, upB, ga, gb) {
    const anc = { 1: ['父', '母'], 2: ['祖父', '祖母'], 3: ['曾祖父', '曾祖母'], 4: ['高祖父', '高祖母'], 5: ['天祖父', '天祖母'] };
    const des = { 1: ['子', '女'], 2: ['孙', '孙女'], 3: ['曾孙', '曾孙女'], 4: ['玄孙', '玄孙女'], 5: ['来孙', '来孙女'] };
    const pick = (arr, g) => arr[g === 'f' ? 1 : 0];
    if (upA === 0) {
      return { a: pick(anc[upB] || ['世祖', '世祖母'], ga), b: pick(des[upB] || ['世孙', '世孙女'], gb) };
    }
    if (upB === 0) {
      return { a: pick(des[upA] || ['世孙', '世孙女'], ga), b: pick(anc[upA] || ['世祖', '世祖母'], gb) };
    }
    if (upA === upB) {
      if (upA === 1) return { a: '兄弟/姊妹', b: '兄弟/姊妹' };
      if (upA === 2) return { a: '从兄弟/从姊妹', b: '从兄弟/从姊妹' };
      if (upA === 3) return { a: '再从兄弟/再从姊妹', b: '再从兄弟/再从姊妹' };
      return { a: '族兄弟（同' + upA + '世祖）', b: '族兄弟（同' + upA + '世祖）' };
    }
    if (upA < upB) {
      const d = upB - upA;
      if (d === 1) {
        if (upA === 1) return { a: ga === 'f' ? '姑母' : '伯叔', b: gb === 'f' ? '侄女' : '侄' };
        if (upA === 2) return { a: ga === 'f' ? '从姑' : '从伯叔', b: gb === 'f' ? '从侄女' : '从侄' };
        return { a: ga === 'f' ? '族姑' : '族伯叔', b: gb === 'f' ? '族侄女' : '族侄' };
      }
      if (d === 2 && upA === 1) {
        return { a: ga === 'f' ? '姑祖母' : '伯祖父/叔祖父', b: gb === 'f' ? '侄孙女' : '侄孙' };
      }
      return { a: '族中长辈（高 ' + d + ' 辈）', b: '族中晚辈（低 ' + d + ' 辈）' };
    }
    const d = upA - upB;
    if (d === 1) {
      if (upB === 1) return { a: ga === 'f' ? '侄女' : '侄', b: gb === 'f' ? '姑母' : '伯叔' };
      if (upB === 2) return { a: ga === 'f' ? '从侄女' : '从侄', b: gb === 'f' ? '从姑' : '从伯叔' };
      return { a: ga === 'f' ? '族侄女' : '族侄', b: gb === 'f' ? '族姑' : '族伯叔' };
    }
    if (d === 2 && upB === 1) {
      return { a: ga === 'f' ? '侄孙女' : '侄孙', b: gb === 'f' ? '姑祖母' : '伯祖父/叔祖父' };
    }
    return { a: '族中晚辈（低 ' + d + ' 辈）', b: '族中长辈（高 ' + d + ' 辈）' };
  }

  function qaTreeKinship(a, b) {
    if (!a || !b || a.family !== b.family) return null;
    const pm = qaParentMap(a.family);
    const anA = qaAncestors(a.id, pm);
    const anB = qaAncestors(b.id, pm);
    let best = null;
    anA.forEach((va, anc) => {
      const vb = anB.get(anc);
      if (!vb) return;
      const total = va.dist + vb.dist;
      if (!best || total < best.total || (total === best.total && Math.max(va.dist, vb.dist) < Math.max(best.upA, best.upB))) {
        best = { anc: anc, upA: va.dist, upB: vb.dist, total: total, pathA: va.path, pathB: vb.path };
      }
    });
    if (!best) return null;
    const ga = qaGender(QP.get(a.id)), gb = qaGender(QP.get(b.id));
    const terms = qaKinTerms(best.upA, best.upB, ga, gb);
    const chain = best.pathA.concat(best.pathB.slice(0, -1).reverse());
    const names = chain.map(id => '<strong>' + esc(qaName(id)) + '</strong>').join(' → ');
    const skipped = best.total > chain.length - 1;
    return {
      title: a.name + ' × ' + b.name,
      body: '<p>按世系推算：<strong>' + esc(a.name) + '</strong>是<strong>' + esc(b.name) + '</strong>的' + terms.a +
        '；<strong>' + esc(b.name) + '</strong>是<strong>' + esc(a.name) + '</strong>的' + terms.b + '。</p>' +
        '<p>世系链：' + names + '（共 ' + best.total + ' 世' + (skipped ? '，中间有未收录的世代' : '') + '）。</p>' +
        '<p class="qa-src">图谱中没有二人直接的连线，此结果由家族世系树推算。</p>',
      sources: qaUnique([QP.get(a.id) && QP.get(a.id).source, QP.get(b.id) && QP.get(b.id).source]),
      ids: chain,
      tree: { famId: a.family, ids: chain },
      face: 'a',
      meta: '依据：世系树推算'
    };
  }

  function qaRelationAnswer(a, b, q) {
    const rels = RELATIONS.filter(r => (r.a === a.id && r.b === b.id) || (r.a === b.id && r.b === a.id));
    const why = /为什么|为何|决裂|交恶|反目|翻脸/.test(q);

    if (!rels.length) {
      if (a.family === b.family) {
        const kin = qaTreeKinship(a, b);
        if (kin) return kin;
        const d = (b.gen || 0) - (a.gen || 0);
        if (d !== 0) {
          return {
            title: a.name + ' × ' + b.name,
            body: '<p>世系树中没有找到二人的共同祖先。按族内辈分推算，<strong>' + esc(a.name) + '</strong>比<strong>' + esc(b.name) + '</strong>' +
              (d > 0 ? '高 ' : '低 ') + Math.abs(d) + ' 辈，属族中' + (d > 0 ? '长辈' : '晚辈') + '。</p>' +
              '<p class="qa-src">此结论只依据世代号，未找到共祖链条。</p>',
            ids: [a.id, b.id], face: 'a', meta: '依据：辈分推算'
          };
        }
        return {
          title: a.name + ' × ' + b.name,
          body: '<p>二人同属 ' + esc(FAMILY_NAME[a.family]) + '，图谱中没有直接连线，世系树中也找不到共同祖先，按世代号则为同辈族亲。</p>',
          ids: [a.id, b.id], meta: '依据：族属判定'
        };
      }
      const na = new Set(), nb = new Set();
      RELATIONS.forEach(r => {
        if (r.a === a.id) na.add(r.b);
        if (r.b === a.id) na.add(r.a);
        if (r.a === b.id) nb.add(r.b);
        if (r.b === b.id) nb.add(r.a);
      });
      const common = Array.from(na).filter(x => nb.has(x) && QP.has(x));
      if (common.length) {
        const names = common.slice(0, 3).map(id => QP.get(id).name).join('、');
        return {
          title: a.name + ' × ' + b.name,
          body: '<p>没有直接连线，但二人通过 <strong>' + esc(names) + '</strong> 相连，可在图中沿高亮节点看到这条两跳路径。</p>',
          ids: [a.id, b.id].concat(common.slice(0, 3)), meta: '依据：两跳路径'
        };
      }
      const fr = RELATIONS.filter(r => r.type !== 'kin' && r.type !== 'marriage' && ((r.a === a.family && r.b === b.family) || (r.b === a.family && r.a === b.family)));
      if (fr.length) {
        return {
          title: a.name + ' × ' + b.name,
          body: '<p>二人没有直接连线，但两族之间有关系：</p><ul>' + fr.map(r => '<li><strong>' + qaTypeName(r.type) + '</strong>：' + esc(r.label) + '</li>').join('') + '</ul>',
          ids: [a.id, b.id], meta: '依据：家族关系'
        };
      }
      return {
        title: a.name + ' × ' + b.name,
        body: '<p>图谱中没有检索到直接关系，也没有可用的中间人或家族关系。</p>',
        ids: [a.id, b.id], meta: '依据：图谱检索'
      };
    }

    const ordered = why
      ? rels.slice().sort((x, y) => (x.type === 'conflict' ? -1 : 1) - (y.type === 'conflict' ? -1 : 1))
      : rels;
    let lead = '';
    if (why) {
      const conf = rels.filter(r => r.type === 'conflict');
      lead = conf.length
        ? '<p>直接原因是：' + esc(conf.map(r => r.label).join('；')) + '。</p>'
        : '<p>图谱中没有「决裂」类记录，二人的关系以' + qaTypeName(rels[0].type) + '为主。</p>';
    }
    const items = ordered.map(r => '<li><strong>' + qaTypeName(r.type) + '</strong>：' + esc(r.label) + '</li>').join('');
    const sources = qaUnique([a.source, b.source]);
    const needB = rels.some(r => FACE_OF[r.type] === 'b');
    return {
      title: a.name + ' × ' + b.name,
      body: lead + '<ul>' + items + '</ul>',
      sources: sources,
      ids: [a.id, b.id],
      face: needB ? 'b' : 'a',
      tree: (!needB && a.family === b.family) ? { famId: a.family, ids: [a.id, b.id] } : null,
      meta: '依据：图谱直连 ' + rels.length + ' 条'
    };
  }

  function qaKinAnswer(p, q) {
    const want = [];
    if (/儿子|长子|次子|幼子|子嗣|子女/.test(q)) want.push('son');
    if (/女儿/.test(q)) want.push('daughter');
    if (/父亲|之父/.test(q)) want.push('parent');
    if (/兄弟|兄长|弟弟|胞兄/.test(q)) want.push('brother');
    if (/妻子|夫人|妻室|配偶|娶/.test(q)) want.push('marriage');
    if (/后代|子孙|后裔/.test(q)) want.push('son', 'daughter');

    const found = [];
    RELATIONS.forEach(r => {
      if (r.a !== p.id && r.b !== p.id) return;
      const otherId = r.a === p.id ? r.b : r.a;
      const o = QP.get(otherId);
      if (!o) return;
      const lbl = r.label || '';
      let kind = null;
      if (r.type === 'marriage') kind = 'marriage';
      else if (/^(养|族|继)?父(子|女)/.test(lbl)) {
        if (p.gen < o.gen) kind = /父子/.test(lbl) ? 'son' : 'daughter';
        else if (p.gen > o.gen) kind = 'parent';
      } else if (/兄弟|从兄弟|族兄弟/.test(lbl)) kind = 'brother';
      if (kind && want.indexOf(kind) !== -1) found.push({ o: o, kind: kind, label: lbl });
    });

    if (!found.length) {
      return {
        title: p.name,
        body: '<p>图谱中没有检索到这类亲属记录。可以试试「介绍' + esc(p.name) + '」。</p>',
        ids: [p.id], meta: '依据：图谱检索'
      };
    }
    const labelOf = { son: '子', daughter: '女', parent: '父辈', brother: '兄弟', marriage: '妻 / 夫' };
    const items = found.map(f => '<li><strong>' + labelOf[f.kind] + '</strong>：' + esc(f.o.name) + (f.o.title ? '（' + esc(f.o.title) + '）' : '') + '<span class="qa-src">　' + esc(f.label) + '</span></li>').join('');
    return {
      title: p.name + ' · 亲属',
      body: '<ul>' + items + '</ul>',
      sources: qaUnique([p.source].concat(found.map(f => f.o.source))),
      ids: [p.id].concat(found.map(f => f.o.id)),
      tree: { famId: p.family, ids: [p.id].concat(found.map(f => f.o.id)) },
      face: 'a',
      meta: '依据：血缘 / 姻亲'
    };
  }

  function qaIntroAnswer(p) {
    const life = lifeText(p);
    const line = [];
    if (p.zi) line.push('字 ' + esc(p.zi));
    if (life) line.push(esc(life));
    if (p.title) line.push(esc(p.title));
    let body = '';
    if (line.length) body += '<p>' + line.join('　·　') + '</p>';
    body += '<p>' + esc(p.desc || '') + '</p>';
    const rels = RELATIONS.filter(r => r.a === p.id || r.b === p.id);
    if (rels.length) {
      const top = rels.slice(0, 3).map(r => {
        const oid = r.a === p.id ? r.b : r.a;
        return esc(qaName(oid)) + '（' + qaTypeName(r.type) + '）';
      });
      body += '<p><strong>主要关系</strong>：' + top.join('、') + '。</p>';
    }
    return {
      title: p.name,
      body: body,
      sources: qaUnique([p.source]),
      ids: [p.id].concat(rels.slice(0, 2).map(r => (r.a === p.id ? r.b : r.a))),
      face: 'a',
      meta: '依据：人物志'
    };
  }

  function qaFamilyAnswer(f) {
    const members = PEOPLE.filter(p => p.family === f.id).sort((a, b) =>
      (a.gen - b.gen) || (yearOf(a.born) - yearOf(b.born)) || (a.name < b.name ? -1 : 1)
    );
    const gens = Array.from(new Set(members.map(p => p.gen))).sort((a, b) => a - b);
    const list = gens.map(g => {
      const names = members.filter(p => p.gen === g).map(p => esc(p.name)).join('、');
      return '<li>' + (CN_NUM[g] || g) + '世：' + names + '</li>';
    }).join('');
    return {
      title: f.name,
      body: '<p>' + esc(f.desc) + '</p><p><strong>郡望</strong>：' + esc(f.seat) + '　<strong>时期</strong>：' + esc(f.eraLabel || '') + '</p><ul>' + list + '</ul>',
      ids: [f.id].concat(members.map(p => p.id)),
      face: 'a',
      meta: '依据：家族志 · ' + members.length + ' 人'
    };
  }

  function qaKeywordAnswer(q) {
    const kw = q.replace(/有哪些人参与|有哪些人|谁参与|参与了|有哪些|是谁|是什么关系|介绍|简介|生平|资料|的/g, '').trim();
    if (kw.length < 2) return qaFallback(q);
    const score = new Map();
    const add = (id, w) => score.set(id, (score.get(id) || 0) + w);
    RELATIONS.forEach(r => {
      if ((r.label || '').indexOf(kw) !== -1) { add(r.a, 3); add(r.b, 3); }
    });
    PEOPLE.forEach(p => {
      const hay = [p.name, p.zi, p.title, p.desc, p.source].join(' ');
      if (hay.indexOf(kw) !== -1) add(p.id, 2);
    });
    FAMILIES.forEach(f => {
      if ((f.desc + f.highlights.join('')).indexOf(kw) !== -1) add(f.id, 1);
    });
    const ids = Array.from(score.keys()).sort((x, y) => score.get(y) - score.get(x)).slice(0, 8);
    if (!ids.length) return qaFallback(q);
    const items = ids.filter(id => QP.has(id)).slice(0, 7).map(id => {
      const p = QP.get(id);
      return '<li><strong>' + esc(p.name) + '</strong>' + (p.title ? '（' + esc(p.title) + '）' : '') + '：' + esc(qaSnippet(p, kw)) + '</li>';
    }).join('');
    return {
      title: '「' + esc(kw) + '」相关',
      body: '<p>图谱与人物小传中检索到以下线索：</p><ul>' + items + '</ul>',
      ids: ids,
      face: 'b',
      meta: '依据：全文检索'
    };
  }

  function qaFallback(q) {
    return {
      title: '没有找到直接答案',
      body: '<p>「' + esc(q) + '」在现有图谱里没有匹配到人物或关系。可以试试：</p><ul>' +
        '<li>曹操和荀彧是什么关系？</li><li>荀彧有哪些儿子？</li><li>介绍谢安</li><li>琅琊王氏</li></ul>',
      ids: [], meta: '依据：未命中'
    };
  }

  function qaAnswer(raw) {
    const q = String(raw || '').trim();
    const nq = q.replace(/[\s，。？！、,.?!"'「」『』（）()：:；;]/g, '');
    if (!nq) return qaFallback(q);
    const ents = qaEntities(nq);
    const persons = ents.filter(e => e.kind === 'person').map(e => QP.get(e.id)).filter(Boolean);
    const fams = ents.filter(e => e.kind === 'family').map(e => QF.get(e.id)).filter(Boolean);

    if (persons.length >= 2) return qaRelationAnswer(persons[0], persons[1], nq);
    if (persons.length === 1) {
      if (/关系|联系/.test(nq) && /和|与|跟/.test(nq)) {
        const other = nq.split(/和|与|跟/)
          .map(s => s.replace(/是什么关系|什么关系|的关系|关系|联系/g, ''))
          .filter(s => s && s !== persons[0].name && s.indexOf(persons[0].name) === -1);
        if (other.length) {
          return {
            title: persons[0].name + ' × ' + other[0],
            body: '<p>图谱中未收录「' + esc(other[0]) + '」，无法给出二者的关系。</p><p>当前收录范围：曹魏、两晋的门阀人物。</p>',
            ids: [persons[0].id], meta: '依据：未收录'
          };
        }
      }
      if (/有哪些|儿子|女儿|父亲|兄弟|妻子|夫人|后代|子孙|亲属/.test(nq)) return qaKinAnswer(persons[0], nq);
      if (/关系|联系|为何|为什么|决裂|交恶/.test(nq) && fams.length) return qaRelationAnswer(persons[0], fams[0], nq);
      return qaIntroAnswer(persons[0]);
    }
    if (fams.length === 1) return qaFamilyAnswer(fams[0]);
    return qaKeywordAnswer(nq);
  }

  function qaEnsureEra(ids) {
    const missing = ids.some(id => !nodeById.has(id));
    if (!missing) return;
    const count = { wei: 0, jin: 0 };
    ids.forEach(id => {
      const p = QP.get(id);
      if (p) eraList(p).forEach(e => { if (count[e] != null) count[e]++; });
    });
    const target = count.wei > count.jin ? 'wei' : (count.jin > count.wei ? 'jin' : era);
    if (target !== era) applyEra(target);
  }

  function qaLocate(ids) {
    const ns = ids.map(id => nodeById.get(id)).filter(Boolean);
    if (!ns.length) return;
    qaHits = new Set(ns.map(n => n.id));
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    ns.forEach(n => {
      minX = Math.min(minX, n.x - n.r);
      maxX = Math.max(maxX, n.x + n.r);
      minY = Math.min(minY, n.y - n.r);
      maxY = Math.max(maxY, n.y + n.r);
    });
    const pad = 130;
    const bw = Math.max(1, maxX - minX + pad * 2);
    const bh = Math.max(1, maxY - minY + pad * 2);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const z = Math.max(0.55, Math.min(1.25, Math.min(W / bw, H / bh)));
    view.zoom = z;
    view.x = W / 2 - cx * z;
    view.y = H / 2 - cy * z;
  }

  function qaPush(role, html) {
    const div = document.createElement('div');
    div.className = 'qa-msg ' + (role === 'user' ? 'qa-user' : 'qa-bot');
    div.innerHTML = html;
    askLog.appendChild(div);
    askLog.scrollTop = askLog.scrollHeight;
  }

  function qaRender(ans) {
    let html = '';
    if (ans.title) html += '<h4>' + esc(ans.title) + '</h4>';
    html += ans.body || '';
    if (ans.sources && ans.sources.length) {
      html += '<div class="qa-src">史料：' + ans.sources.map(esc).join('；') + '</div>';
    }
    html += '<div class="qa-meta"><span class="qa-badge">' + esc(ans.meta || '依据：图谱检索') + '</span>';
    if (ans.tree) html += '<span class="qa-badge">世系图已高亮</span>';
    if (ans.ids && ans.ids.length && !ans.tree) html += '<span class="qa-badge">图中已定位</span>';
    if (ans.ids && ans.ids.length) html += '<button class="qa-clear" data-clear="' + (ans.tree ? 'tree' : 'canvas') + '">清除高亮</button>';
    html += '</div>';
    qaPush('bot', html);
  }

  function qaAsk(text) {
    const q = String(text || '').trim();
    if (!q) return;
    qaTreeHits = new Set();
    qaTreeFam = null;
    qaPush('user', esc(q));
    askInput.value = '';
    let ans;
    try {
      ans = qaAnswer(q);
    } catch (err) {
      ans = { title: '检索出错', body: '<p>' + esc(String(err && err.message || err)) + '</p>', ids: [] };
    }
    qaRender(ans);
    if (ans.tree && ans.tree.famId) {
      qaEnsureEra([ans.tree.famId].concat(ans.tree.ids || []));
      applyFace('a');
      qaHits = new Set();
      qaTreeHits = new Set(ans.tree.ids || []);
      qaTreeFam = ans.tree.famId;
      const famNode = nodeById.get(ans.tree.famId);
      if (famNode) {
        selected = null;
        renderDetail(famNode);
        panel.scrollTop = 0;
      }
      return;
    }
    if (ans.ids && ans.ids.length) {
      panel.classList.remove('open');
      selected = null;
      qaEnsureEra(ans.ids);
      if (ans.face) applyFace(ans.face);
      qaLocate(ans.ids);
    }
  }

  askChips.addEventListener('click', e => {
    const btn = e.target.closest('[data-q]');
    if (btn) qaAsk(btn.getAttribute('data-q'));
  });
  askSend.addEventListener('click', () => qaAsk(askInput.value));
  askInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); qaAsk(askInput.value); }
  });
  askLog.addEventListener('click', e => {
    const btn = e.target.closest('[data-clear]');
    if (!btn) return;
    const kind = btn.getAttribute('data-clear');
    qaHits = new Set();
    if (kind === 'tree') {
      qaTreeHits = new Set();
      qaTreeFam = null;
      panel.classList.remove('open');
    }
  });

  qaPush('bot', '<h4>你好，我是这套图谱的问答原型</h4>' +
    '<p>可以问我「曹操和荀彧是什么关系」「荀彧有哪些儿子」「介绍谢安」「琅琊王氏」。</p>' +
    '<p class="qa-src">本地检索：实体识别 → 关系检索 → 史料引用 → 图谱定位。</p>');


  // ---------- resize / loop ----------
  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = Math.max(320, Math.round(rect.width));
    H = Math.max(360, Math.round(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rebuild() {
    resizeCanvas();
    buildGraph();
    relax(360);
    fitView();
    needsRelax = true;
    relaxBudget = 120;
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const keep = selected ? selected.id : null;
      rebuild();
      if (keep) {
        const nd = nodeById.get(keep);
        if (nd) selectNode(nd, false);
      }
    }, 200);
  });

  function loop() {
    if (needsRelax && relaxBudget > 0) {
      const m = relax(3);
      relaxBudget -= 3;
      if (m < 0.04) relaxBudget = 0;
      if (relaxBudget <= 0) needsRelax = false;
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- init ----------
  subtitle.textContent = ERA_LABEL[era].subtitle;
  renderEraBar();
  renderLegend();
  renderFaceSwitch();
  renderFilters();
  updateStats();
  rebuild();
  requestAnimationFrame(loop);
})();
</script>
</body>
