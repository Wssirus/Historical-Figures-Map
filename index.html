<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>魏晋门阀士族关系图谱</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FBF3E7;
    --card: #FFF9F1;
    --text: #31251B;
    --text-secondary: #8B7662;
    --accent: #C96F3D;
    --green: #7E9F7A;
    --blue: #5B7FA5;
    --red: #B85450;
    --gold: #B8973A;
    --border: #E8D5C0;
    --shadow: rgba(49, 37, 27, 0.08);
  }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    padding: 1.4rem 1.5rem 0.9rem;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: clamp(1.4rem, 3.6vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--text);
    margin-bottom: 0.25rem;
  }

  header p {
    font-size: 0.9rem;
    color: var(--text-secondary);
    font-style: italic;
  }

  .stats {
    margin-top: 0.45rem;
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
    font-style: normal;
  }

  .era-bar {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    padding: 0 0.25rem;
    border-bottom: 1px solid var(--border);
  }

  .era-btn {
    font: inherit;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    padding: 0.42rem 0.9rem;
    border: none;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color .15s, border-color .15s;
  }
  .era-btn:hover { color: var(--text); }
  .era-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .era-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .era-note {
    margin-left: auto;
    font-size: 0.72rem;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    padding-right: 0.2rem;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0.9rem 1rem 1rem;
    gap: 0.7rem;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.55rem 0.8rem;
    padding: 0.55rem 0.75rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .search-wrap {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  #search {
    font: inherit;
    font-size: 0.84rem;
    width: 220px;
    max-width: 46vw;
    padding: 0.3rem 0.85rem;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #search::placeholder { color: #B5A28E; }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,111,61,.14); }

  #searchCount { font-size: 0.72rem; color: var(--text-secondary); min-width: 2.4em; }

  .filters { display: flex; flex-wrap: wrap; gap: 0.32rem; }

  .face-switch {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--bg);
    flex: none;
  }

  .face-btn {
    font: inherit;
    font-size: 0.76rem;
    padding: 0.18rem 0.72rem;
    border: none;
    border-radius: 14px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .face-btn:hover { color: var(--text); }
  .face-btn.active { background: var(--accent); color: #FFF9F1; font-weight: 600; }
  .face-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.32rem;
    font: inherit;
    font-size: 0.75rem;
    padding: 0.16rem 0.6rem;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .filter-btn:hover { background: var(--bg); }
  .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .filter-btn.active { border-color: var(--accent); background: rgba(201,111,61,.1); font-weight: 600; }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  /* ---------- canvas ---------- */
  .canvas-wrap {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 12px var(--shadow);
    overflow: hidden;
    flex: 1;
    min-height: 340px;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }
  canvas.grabbing { cursor: grabbing; }
  canvas.pointing { cursor: pointer; }

  .controls {
    display: flex;
    gap: 0.4rem;
    position: absolute;
    top: 0.7rem;
    right: 0.7rem;
    z-index: 10;
  }

  .ctrl-btn {
    width: 34px; height: 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
    font-size: 1rem;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .ctrl-btn:hover, .ctrl-btn:focus-visible { background: var(--bg); color: var(--text); outline: 2px solid var(--accent); outline-offset: 2px; }

  .tooltip {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -140%);
    background: rgba(49, 37, 27, 0.94);
    color: #FFF9F1;
    padding: 0.32rem 0.62rem;
    border-radius: 6px;
    font-size: 0.75rem;
    line-height: 1.55;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 20;
  }
  .tooltip.show { opacity: 1; }
  .tooltip small { color: #D9C6B0; font-size: 0.7rem; }

  /* ---------- legend ---------- */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem 1.2rem;
    padding: 0.7rem 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    justify-content: center;
    align-items: center;
  }

  .legend-title {
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.38rem;
    font-size: 0.78rem;
    color: var(--text);
  }

  .legend-line { width: 26px; height: 3px; border-radius: 2px; }
  .legend-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid; }

  .tip {
    text-align: center;
    font-size: 0.76rem;
    color: var(--text-secondary);
    padding: 0 0.5rem;
    font-style: italic;
  }

  .footnote {
    text-align: center;
    font-size: 0.7rem;
    color: #A08C77;
    padding: 0 0.5rem 0.4rem;
  }

  /* ---------- detail panel ---------- */
  .detail-panel {
    position: fixed;
    top: 0; right: 0;
    width: min(430px, 94vw);
    height: 100vh;
    background: var(--card);
    border-left: 1px solid var(--border);
    box-shadow: -4px 0 20px var(--shadow);
    padding: 1.7rem 1.4rem 2.5rem;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    overflow-y: auto;
    z-index: 100;
  }
  .detail-panel.open { transform: translateX(0); }

  .detail-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 1rem;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .detail-close:hover, .detail-close:focus-visible { background: var(--bg); color: var(--text); outline: 2px solid var(--accent); }

  .detail-name {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 0.45rem;
    color: var(--text);
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding-right: 2rem;
  }

  .detail-zi { font-size: 0.76rem; color: var(--text-secondary); font-weight: 400; letter-spacing: 0.04em; }

  .detail-family-tag {
    display: inline-block;
    padding: 0.13rem 0.62rem;
    border-radius: 20px;
    font: inherit;
    font-size: 0.74rem;
    margin-bottom: 0.9rem;
    color: #fff;
    border: none;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .detail-family-tag:hover { filter: brightness(1.12); }

  .face-note {
    font-size: 0.72rem;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    margin: -0.45rem 0 0.5rem;
  }

  .detail-section { margin-top: 1.1rem; }

  .detail-section h3 {
    font-size: 0.78rem;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 0.4rem;
    letter-spacing: 0.08em;
  }

  .detail-section p, .detail-section li {
    font-size: 0.87rem;
    line-height: 1.75;
    color: var(--text);
  }

  .detail-section ul { list-style: none; padding: 0; }

  .detail-section li {
    padding: 0.32rem 0;
    border-bottom: 1px dashed rgba(232, 213, 192, 0.9);
  }
  .detail-section li:last-child { border-bottom: none; }

  .rel-type {
    display: inline-block;
    font-size: 0.66rem;
    line-height: 1.55;
    padding: 0 0.28rem;
    border: 1px solid;
    border-radius: 3px;
    margin-right: 0.34rem;
    vertical-align: 1px;
    letter-spacing: 0.02em;
  }

  .link-btn {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 0.87rem;
    color: #8A4A26;
    cursor: pointer;
    border-bottom: 1px dashed rgba(138, 74, 38, 0.45);
  }
  .link-btn:hover, .link-btn:focus-visible { color: var(--accent); border-bottom-style: solid; outline: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.32rem; }

  .chip {
    font: inherit;
    font-size: 0.74rem;
    padding: 0.12rem 0.5rem;
    border-radius: 14px;
    border: 1px solid;
    background: transparent;
    cursor: pointer;
    transition: background .15s;
  }
  .chip:hover { background: rgba(0, 0, 0, 0.045); }

  .family-lead { font-size: 0.8rem; color: var(--text-secondary); }

  /* ---------- 侧栏：家族世系 ---------- */
  .detail-panel.wide { width: min(620px, 96vw); }

  .family-tree { margin: 0.35rem 0 0; }
  .family-tree svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ft-node { cursor: pointer; }
  .ft-node rect { transition: fill .15s, stroke-width .15s; }
  .ft-node:hover rect { fill: #F6E7D5; stroke-width: 1.8; }
  .ft-gen-label { fill: rgba(139, 118, 98, 0.9); font-size: 10.5px; letter-spacing: .1em; }
  .ft-guide { stroke: rgba(200, 178, 150, 0.34); stroke-width: 1; stroke-dasharray: 3 5; }
  .ft-edge { fill: none; }
  .ft-node.ft-hit rect { fill: #F6E7D5; stroke: #C96F3D; stroke-width: 2.2; }
  .ft-node.ft-hit text { font-weight: 700; }
  .family-tree.has-hit .ft-node:not(.ft-hit) { opacity: 0.45; }
  .ft-edge.ft-hit { stroke: #C96F3D; stroke-opacity: 0.95; stroke-width: 2; }
  .ft-uncle { stroke-opacity: 0.30; stroke-width: 1; stroke-dasharray: 3 4; }
  .ft-note { font-size: 0.72rem; color: var(--text-secondary); margin-top: 0.4rem; letter-spacing: .03em; line-height: 1.6; }

  /* ---------- 左侧：自然语言问答 ---------- */
  .app-body {
    flex: 1;
    display: flex;
    gap: 0.8rem;
    padding: 0.8rem 1rem 1rem;
    max-width: 1800px;
    margin: 0 auto;
    width: 100%;
    align-items: stretch;
  }
  .app-body main { flex: 1; min-width: 0; max-width: none; margin: 0; padding: 0; }

  .ask-panel {
    width: 336px;
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 12px var(--shadow);
    padding: 0.8rem;
    min-height: 0;
    max-height: calc(100vh - 130px);
    position: sticky;
    top: 0.8rem;
  }

  .ask-head { display: flex; align-items: center; gap: 0.5rem; }
  .ask-title { font-size: 1.02rem; font-weight: 700; letter-spacing: 0.14em; }
  .ask-tag { font-size: 0.66rem; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 20px; padding: 0 0.45rem; }

  .ask-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .ask-chips button {
    font: inherit; font-size: 0.72rem; color: var(--text-secondary);
    background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
    padding: 0.1rem 0.5rem; cursor: pointer; text-align: left;
  }
  .ask-chips button:hover { color: var(--text); border-color: var(--accent); }

  .ask-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.55rem; padding-right: 0.15rem; min-height: 120px; }
  .qa-msg { font-size: 0.82rem; line-height: 1.72; }
  .qa-user { align-self: flex-end; background: #F3E3CF; border-radius: 10px 10px 2px 10px; padding: 0.35rem 0.6rem; max-width: 88%; }
  .qa-bot { border: 1px solid var(--border); background: #FFFDF8; border-radius: 10px; padding: 0.55rem 0.65rem; }
  .qa-bot h4 { font-size: 0.85rem; margin-bottom: 0.25rem; letter-spacing: 0.03em; }
  .qa-bot p { margin: 0.2rem 0; }
  .qa-bot ul { margin: 0.15rem 0 0.2rem 1rem; }
  .qa-bot li { margin: 0.12rem 0; }
  .qa-src { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.3rem; }
  .qa-meta { font-size: 0.68rem; color: var(--text-secondary); margin-top: 0.25rem; display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .qa-badge { border: 1px solid var(--border); border-radius: 10px; padding: 0 0.35rem; }
  .qa-clear { font: inherit; font-size: 0.68rem; color: var(--accent); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }

  .ask-input { display: flex; gap: 0.4rem; }
  .ask-input input {
    flex: 1; min-width: 0; font: inherit; font-size: 0.8rem; padding: 0.4rem 0.6rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none;
  }
  .ask-input input:focus { border-color: var(--accent); }
  .ask-input button {
    font: inherit; font-size: 0.8rem; padding: 0.4rem 0.8rem; border: none; border-radius: 8px;
    background: var(--accent); color: #FFF9F1; cursor: pointer;
  }
  .ask-input button:hover { filter: brightness(1.08); }
  @media (max-width: 1080px) {
    .app-body { flex-direction: column; padding: 0.6rem; }
    .ask-panel { width: 100%; max-height: 340px; position: static; }
    .ask-log { min-height: 90px; }
  }

  @media (max-width: 640px) {
    header { padding: 1rem 1rem 0.7rem; }
    header h1 { letter-spacing: 0.08em; }
    main { padding: 0.5rem; gap: 0.5rem; }
    .canvas-wrap { min-height: 70vh; }
    .legend { gap: 0.35rem 0.8rem; padding: 0.55rem 0.7rem; }
    .detail-panel { width: 100vw; }
    #search { width: 150px; }
    .era-note { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .detail-panel { transition: none; }
  }

  @media print {
    body { background: #fff; }
    .controls, .tip, .footnote, .detail-panel, .toolbar, .era-bar { display: none; }
    .canvas-wrap { border: 1px solid #ccc; box-shadow: none; min-height: auto; }
    header { border-bottom: 1px solid #ccc; }
  }
</style>
</head>
<body>

<header>
  <h1>魏晋门阀士族关系图谱</h1>
  <p id="subtitle">曹魏卷——曹氏、夏侯氏与颍川、汝南士族</p>
  <div class="stats" id="stats"></div>
</header>

<div class="app-body">
  <aside class="ask-panel" id="askPanel" aria-label="自然语言问答">
    <div class="ask-head">
      <span class="ask-title">问一问</span>
      <span class="ask-tag">本地检索</span>
    </div>
    <div class="ask-chips" id="askChips">
      <button data-q="曹操和荀彧是什么关系？">曹操和荀彧是什么关系？</button>
      <button data-q="王导和司马睿是什么关系？">王导和司马睿是什么关系？</button>
      <button data-q="荀彧有哪些儿子？">荀彧有哪些儿子？</button>
      <button data-q="介绍谢安">介绍谢安</button>
      <button data-q="琅琊王氏">琅琊王氏</button>
      <button data-q="淝水之战有哪些人参与？">淝水之战有哪些人参与？</button>
    </div>
    <div class="ask-log" id="askLog"></div>
    <div class="ask-input">
      <input id="askInput" type="text" placeholder="例如：曹操和荀彧是什么关系？" autocomplete="off" aria-label="输入问题">
      <button id="askSend">提问</button>
    </div>
  </aside>
  <main>
  <div class="era-bar" id="eraBar" role="tablist" aria-label="切换朝代">
    <button class="era-btn active" data-era="wei" role="tab" aria-selected="true">曹魏卷</button>
    <button class="era-btn" data-era="jin" role="tab" aria-selected="false">两晋卷</button>
    <span class="era-note">同一批节点位置，A面看亲缘、B面看交游政治</span>
  </div>

  <div class="toolbar">
    <div class="face-switch" id="faceSwitch" role="tablist" aria-label="切换图面">
      <button class="face-btn active" data-face="a" role="tab" aria-selected="true">A · 亲缘</button>
      <button class="face-btn" data-face="b" role="tab" aria-selected="false">B · 交游政治</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="检索人物 / 字 / 官职…" autocomplete="off" aria-label="检索人物">
      <span id="searchCount"></span>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="graph"></canvas>
    <div class="controls">
      <button class="ctrl-btn" id="btnZoomIn" title="放大" aria-label="放大">＋</button>
      <button class="ctrl-btn" id="btnZoomOut" title="缩小" aria-label="缩小">－</button>
      <button class="ctrl-btn" id="btnFit" title="适应窗口" aria-label="适应窗口">⤢</button>
      <button class="ctrl-btn" id="btnReset" title="复位" aria-label="复位">↺</button>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="legend" id="legend"></div>

  <p class="tip">左侧问答可直接定位人物 · A / B 切换图面 · 点击家族名看该族世系 · 点击人物看详情 · 滚轮缩放 · 双击空白处复位</p>
  <p class="footnote">数据据《晋书》《宋书》《魏书》《三国志》《世说新语》等整理；生卒年异说者以「约」标识，无考者留空。</p>
  </main>
</div>

<div class="detail-panel" id="detailPanel">
  <button class="detail-close" id="detailClose" aria-label="关闭">✕</button>
  <div id="detailContent"></div>
</div>

<script>
(function () {
  'use strict';

  // ==================== DATA START ====================
  // 家族：era 标记所属卷（'wei' 曹魏 / 'jin' 两晋 / 数组表示跨卷）；同卷内按数组顺序排布于椭圆
  // 收录范围：曹魏、两晋门阀。A面看血缘与姻亲，B面看交游与政治
  const FAMILIES = [
    // ================= 曹魏卷 =================

      source: '《三国志·荀攸传》' },
    { id: 'xun_yun', name: '荀恽', zi: '长倩', born: '', died: '', gen: 4, family: 'xun', era: 'wei',
      title: '虎贲中郎将',
      desc: '荀彧长子，嗣封万岁亭侯，娶曹操女安阳公主。与曹植亲善，为曹丕所忌。',
      source: '《三国志·荀彧传》' },
    { id: 'xun_can', name: '荀粲', zi: '奉倩', born: '', died: '', gen: 4, family: 'xun', era: 'wei',
      title: '未仕（玄学家）',
      desc: '荀彧幼子，尚玄学，倡「言不尽意」。娶曹洪女，妻病亡，痛悼而卒，年二十九。',
      source: '《三国志·荀彧传》注引《晋阳秋》' },
    { id: 'xun_yi', name: '荀顗', zi: '景倩', born: '', died: '274', gen: 4, family: 'xun', era: 'wei',
      title: '西晋太尉',
      desc: '荀彧之子。仕魏至司空，佐司马氏代魏，入晋为太尉，封临淮公。',
      source: '《晋书·荀顗传》' },
    { id: 'xun_xu', name: '荀勖', zi: '公曾', born: '', died: '289', gen: 5, family: 'xun', era: 'wei',
      title: '西晋中书监',
      desc: '荀爽曾孙。仕魏入晋，官至中书监、尚书令，领著作，整理典籍；善音律，有「荀勖笛律」。',
      source: '《晋书·荀勖传》' },

    // ---------- 曹魏：颍川钟氏 ----------
    { id: 'zhong_hao', name: '钟皓', zi: '季明', born: '', died: '', gen: 1, family: 'zhong', era: 'wei',
      title: '林虑长',
      desc: '颍川长社人，与荀淑、韩韶、陈寔并称「颍川四长」。以清德隐退，为钟氏家学之始。',
      source: '《后汉书·钟皓传》' },
    { id: 'zhong_yao', name: '钟繇', zi: '元常', born: '151', died: '230', gen: 2, family: 'zhong', era: 'wei',
      title: '太傅',
      desc: '曹魏太傅，书法之祖，楷书奠基者。镇守关中，为曹操稳定西线；官至太傅，封定陵侯。',
      source: '《三国志·钟繇传》' },
    { id: 'zhong_yu', name: '钟毓', zi: '稚叔', born: '', died: '263', gen: 3, family: 'zhong', era: 'wei',
      title: '青州刺史',
      desc: '钟繇长子。年十四为散骑侍郎，历官青州刺史；弟钟会伐蜀时，毓力言其必败。',
      source: '《三国志·钟毓传》' },
    { id: 'zhong_hui', name: '钟会', zi: '士季', born: '225', died: '264', gen: 3, family: 'zhong', era: 'wei',
      title: '镇西将军、司徒',
      desc: '钟繇幼子。佐司马昭伐蜀，与邓艾分道灭蜀；后谋据蜀自立，死于乱军，钟氏几至覆灭。',
      source: '《三国志·钟会传》' },

    // ---------- 曹魏：范阳卢氏 ----------
    { id: 'lu_zhi', name: '卢植', zi: '子干', born: '', died: '192', gen: 1, family: 'lu', era: 'wei',
      title: '尚书',
      desc: '汉末名儒，通古今学，刘备、公孙瓒皆其弟子。董卓议废立时独抗议，几遭杀害；后隐于上谷。',
      source: '《后汉书·卢植传》' },
    { id: 'lu_yu', name: '卢毓', zi: '子家', born: '183', died: '257', gen: 2, family: 'lu', era: 'wei',
      title: '司空',
      desc: '卢植之子。十岁而孤，为曹操所重；魏文帝、明帝两朝掌选举，官至司空，封容城侯。',
      source: '《三国志·卢毓传》' },
    { id: 'lu_qin', name: '卢钦', zi: '子若', born: '', died: '278', gen: 3, family: 'lu', era: 'wei',
      title: '西晋尚书仆射',
      desc: '卢毓之子。仕魏为侍中，入晋官至尚书仆射；以清俭称，为晋初名臣。',
      source: '《晋书·卢钦传》' },
    { id: 'lu_ting', name: '卢珽', zi: '子笏', born: '', died: '', gen: 3, family: 'lu', era: 'wei',
      title: '泰山太守',
      desc: '卢毓之子。官至泰山太守，子卢志为西晋成都王颖谋主。',
      source: '《晋书·卢志传》' },

    // ---------- 曹魏：汝南袁氏 ----------
    { id: 'yuan_an', name: '袁安', zi: '邵公', born: '', died: '92', gen: 1, family: 'yuan', era: 'wei',
      title: '司徒',
      desc: '汝南袁氏四世三公之始。以「袁安卧雪」著称，官至司徒，子孙累世公卿。',
      source: '《后汉书·袁安传》' },
    { id: 'yuan_jing', name: '袁京', zi: '仲誉', born: '', died: '', gen: 2, family: 'yuan', era: 'wei',
      title: '蜀郡太守',
      desc: '袁安之子，官至蜀郡太守；其子袁汤为司徒，袁氏门第由此益盛。',
      source: '《后汉书·袁安传》' },
    { id: 'yuan_tang', name: '袁汤', zi: '仲河', born: '', died: '', gen: 3, family: 'yuan', era: 'wei',
      title: '太尉',
      desc: '袁京之子。历官司空、司徒、太尉，袁氏「四世三公」之盛自此始。',
      source: '《后汉书·袁安传》' },
    { id: 'yuan_feng', name: '袁逢', zi: '周阳', born: '', died: '', gen: 4, family: 'yuan', era: 'wei',
      title: '司空',
      desc: '袁汤之子。官至司空，生袁绍、袁术；袁绍出继袁成，故绍、术为异母兄弟。',
      source: '《后汉书·袁安传》' },
    { id: 'yuan_wei', name: '袁隗', zi: '次阳', born: '', died: '190', gen: 4, family: 'yuan', era: 'wei',
      title: '太傅',
      desc: '袁逢之弟。官至太傅，与袁逢并为公辅；董卓入京后，因袁绍起兵而被害。',
      source: '《后汉书·袁安传》' },
    { id: 'yuan_shao', name: '袁绍', zi: '本初', born: '', died: '202', gen: 5, family: 'yuan', era: 'wei',
      title: '大将军',
      desc: '袁逢之子，出继袁成。据河北，为关东盟主；官渡之战为曹操所败，惭愤发病而卒。',
      source: '《三国志·袁绍传》' },
    { id: 'yuan_shu', name: '袁术', zi: '公路', born: '', died: '199', gen: 5, family: 'yuan', era: 'wei',
      title: '后将军',
      desc: '袁逢之子，袁绍异母弟。据淮南，僭号称帝，为曹操、吕布所破，呕血而卒。',
      source: '《三国志·袁术传》' },
    { id: 'yuan_tan', name: '袁谭', zi: '显思', born: '', died: '205', gen: 6, family: 'yuan', era: 'wei',
      title: '青州刺史',
      desc: '袁绍长子。袁绍死后与弟袁尚相攻，为曹操所乘，败死。',
      source: '《三国志·袁绍传》附' },

    // ---------- 曹魏：河内司马氏 ----------
    { id: 'sima_lang', name: '司马朗', zi: '伯达', born: '', died: '217', gen: 1, family: 'sima', era: 'wei',
      title: '兖州刺史',
      desc: '司马懿长兄。以清慎称，官至兖州刺史；建安二十二年疫病流行，亲巡致疾而卒。',
      source: '《三国志·司马朗传》' },
    { id: 'sima_fu', name: '司马孚', zi: '叔达', born: '180', died: '272', gen: 1, family: 'sima', era: 'wei',
      title: '魏太傅、晋安平王',
      desc: '司马懿之弟。仕魏至太傅，谨慎自守；入晋封安平王，犹自称「魏之纯臣」。',
      source: '《晋书·安平献王孚传》' },

    // ---------- 琅琊王氏 ----------
    { id: 'wang_xiang', name: '王祥', zi: '休徵', born: '184', died: '268', gen: 1, family: 'langya_wang',
      title: '西晋太保、睢陵公',
      desc: '琅琊王氏显名之始。以孝行著称，「卧冰求鲤」入二十四孝；魏末历司空、太尉，入晋拜太保，位至三公。',
      source: '《晋书·王祥传》' },
    { id: 'wang_lan', name: '王览', zi: '玄通', born: '206', died: '278', gen: 1, family: 'langya_wang',
      title: '光禄大夫',
      desc: '王祥异母弟，以悌行称。其子孙繁衍，王导、王敦皆出此支，为琅琊王氏实际的开枝者。',
      source: '《晋书·王览传》' },
    { id: 'wang_yan', name: '王衍', zi: '夷甫', born: '256', died: '311', gen: 3, family: 'langya_wang',
      title: '太尉、尚书令',
      desc: '西晋清谈领袖，位至三公，口中雌黄、随说随改；永嘉之乱中为石勒所俘，劝进求免，终被推墙压死。',
      source: '《晋书·王衍传》' },
    { id: 'wang_dao', name: '王导', zi: '茂弘', born: '276', died: '339', gen: 3, family: 'langya_wang',
      title: '丞相、录尚书事',
      desc: '东晋开国元勋。辅司马睿渡江称帝，推行「镇之以静」，笼络吴姓士族，历元、明、成三朝，号为「江左管夷吾」。',
      source: '《晋书·王导传》' },
    { id: 'wang_dun', name: '王敦', zi: '处仲', born: '266', died: '324', gen: 3, family: 'langya_wang',
      title: '大将军、荆州牧',
      desc: '王导从兄，握长江上流兵权。永昌元年、太宁二年两度举兵东下，攻入建康；病死军中，事败后戮尸。',
      source: '《晋书·王敦传》' },
    { id: 'wang_yi', name: '王廙', zi: '世将', born: '276', died: '322', gen: 3, family: 'langya_wang',
      title: '平南将军、荆州刺史',
      desc: '王导从弟，晋元帝姨表兄弟，甚见亲待。工书画，尝为羲之讲授笔法，是琅琊王氏艺文传统的重要一环。',
      source: '《晋书·王廙传》' },
    { id: 'wang_xizhi', name: '王羲之', zi: '逸少', born: '303', died: '361', gen: 4, family: 'langya_wang',
      title: '右军将军、会稽内史',
      desc: '「书圣」。少从王廙习书，博采众长，作《兰亭集序》为「天下第一行书」；为政清简，晚岁游处山阴。',
      source: '《晋书·王羲之传》' },
    { id: 'wang_xianzhi', name: '王献之', zi: '子敬', born: '344', died: '386', gen: 5, family: 'langya_wang',
      title: '中书令',
      desc: '羲之第七子，与父并称「二王」。尚新安公主，官至中书令，创「一笔书」，为后世行草典范。',
      source: '《晋书·王献之传》' },
    { id: 'wang_huizhi', name: '王徽之', zi: '子猷', born: '', died: '388', gen: 5, family: 'langya_wang',
      title: '黄门侍郎',
      desc: '羲之第五子，性卓荦不羁。「雪夜访戴」至门不入而返，曰「乘兴而行，兴尽而返」，为江左风流典型。',
      source: '《晋书·王徽之传》' },
    { id: 'wang_ningzhi', name: '王凝之', zi: '叔平', born: '', died: '399', gen: 5, family: 'langya_wang',
      title: '会稽内史、左将军',
      desc: '羲之次子，谢道韫之夫。笃信五斗米道，孙恩之乱时不设备防，城破被杀。',
      source: '《晋书·王凝之传》' },
    { id: 'wang_xun', name: '王珣', zi: '元琳', born: '349', died: '400', gen: 5, family: 'langya_wang',
      title: '尚书令、东亭侯',
      desc: '王导之孙。孝武帝朝为亲信，与殷仲堪等共制司马道子；善行书，《伯远帖》为「三希」之一。',
      source: '《晋书·王珣传》' },
    { id: 'wang_gong', name: '王恭', zi: '孝伯', born: '', died: '398', gen: 5, family: 'langya_wang',
      title: '兖青二州刺史',
      desc: '孝武帝王皇后之兄。安帝即位后起兵讨王国宝，开东晋末年内战之端；后为刘牢之所败，被司马道子杀害。',
      source: '《晋书·王恭传》' },

    // ---------- 太原王氏 ----------
    { id: 'wang_yun', name: '王允', zi: '子师', born: '137', died: '192', gen: 1, family: 'taiyuan_wang',
      title: '司徒、尚书令',
      desc: '汉末士大夫领袖。与吕布合谋诛董卓，后为李傕、郭汜所杀，宗族遇害。',
      source: '《后汉书·王允传》' },
    { id: 'wang_ling', name: '王凌', zi: '彦云', born: '172', died: '251', gen: 2, family: 'taiyuan_wang',
      title: '太尉',
      desc: '王允之侄。曹魏末年谋立楚王曹彪，事泄，司马懿率军讨之，王凌饮药自尽，为「淮南三叛」之首。',
      source: '《三国志·王凌传》' },
    { id: 'wang_chang', name: '王昶', zi: '文舒', born: '', died: '259', gen: 2, family: 'taiyuan_wang',
      title: '司空、骠骑将军',
      desc: '太原晋阳王氏另一支。著《家诫》，官至司空；子王浑为平吴主帅，孙王济尚公主，门第由此大盛。',
      source: '《三国志·王昶传》' },
    { id: 'wang_hun', name: '王浑', zi: '玄冲', born: '223', died: '297', gen: 3, family: 'taiyuan_wang',
      title: '司徒、录尚书事',
      desc: '王昶之子。咸宁五年与王濬等分道伐吴，以功进爵；后与王濬争功，为时论所讥。',
      source: '《晋书·王浑传》' },
    { id: 'wang_ji', name: '王济', zi: '武子', born: '', died: '约290', gen: 4, family: 'taiyuan_wang',
      title: '侍中、驸马都尉',
      desc: '王浑之子，尚晋武帝女常山公主。以「人乳蒸豚」斗富著称，善《易》与清谈，为西晋贵游之冠。',
      source: '《晋书·王济传》' },
    { id: 'wang_cheng', name: '王承', zi: '安期', born: '', died: '', gen: 4, family: 'taiyuan_wang',
      title: '东海内史',
      desc: '王湛之子，王浑之侄。永嘉末渡江，为司马睿所礼，以清谈、政事见称，太原王氏江左一房之祖。',
      source: '《晋书·王承传》' },
    { id: 'wang_shu', name: '王述', zi: '怀祖', born: '303', died: '368', gen: 5, family: 'taiyuan_wang',
      title: '尚书令、蓝田侯',
      desc: '王承之子。性狷急而政事精核，官至尚书令，封蓝田侯；子坦之、孙国宝皆居权要。',
      source: '《晋书·王述传》' },
    { id: 'wang_tanzhi', name: '王坦之', zi: '文度', born: '330', died: '375', gen: 6, family: 'taiyuan_wang',
      title: '中书令、北中郎将',
      desc: '王述之子。简文帝临终，与谢安同受顾命；桓温入朝陈兵，坦之流汗沾衣，仍力争于前。',
      source: '《晋书·王坦之传》' },
    { id: 'wang_guobao', name: '王国宝', zi: '', born: '', died: '397', gen: 7, family: 'taiyuan_wang',
      title: '尚书左仆射',
      desc: '王坦之之子，谢安之婿。党附司马道子，专权纳贿，与王恭交恶；隆安元年被道子赐死。',
      source: '《晋书·王国宝传》' },
    { id: 'wang_chen', name: '王忱', zi: '元达', born: '', died: '392', gen: 7, family: 'taiyuan_wang',
      title: '荆州刺史、建武将军',
      desc: '王坦之之子，与兄王国宝不睦。历官荆州刺史，嗜酒任诞，为东晋末年方镇重臣。',
      source: '《晋书·王忱传》' },

    // ---------- 陈郡谢氏 ----------
    { id: 'xie_heng', name: '谢衡', zi: '', born: '', died: '', gen: 1, family: 'chenjun_xie',
      title: '国子祭酒、散骑常侍',
      desc: '谢氏入仕之始。以儒学显于西晋，官国子祭酒；谢鲲、谢裒皆其子，谢安、谢玄一系由此而出。',
      source: '《晋书·谢鲲传》' },
    { id: 'xie_kun', name: '谢鲲', zi: '幼舆', born: '281', died: '323', gen: 2, family: 'chenjun_xie',
      title: '豫章太守',
      desc: '谢衡之子，谢尚之父。以「任达」著称，曾调戏邻女被折两齿，犹自谓「犹不废我啸歌」。',
      source: '《晋书·谢鲲传》' },
    { id: 'xie_pou', name: '谢裒', zi: '', born: '', died: '', gen: 2, family: 'chenjun_xie',
      title: '太常卿',
      desc: '谢衡之子，谢安之父。永嘉乱后南渡，官至太常卿，六子皆显，陈郡谢氏由此兴。',
      source: '《晋书·谢安传》' },
    { id: 'xie_shang', name: '谢尚', zi: '仁祖', born: '308', died: '357', gen: 3, family: 'chenjun_xie',
      title: '镇西将军、豫州刺史',
      desc: '谢鲲之子。善音乐、能清谈，永和中北伐，取许昌、洛阳；与谢安为从兄弟，是谢氏第一代方镇。',
      source: '《晋书·谢尚传》' },
    { id: 'xie_yi', name: '谢奕', zi: '无奕', born: '', died: '358', gen: 3, family: 'chenjun_xie',
      title: '豫州刺史',
      desc: '谢安之兄。历官剡令、豫州刺史，性豪放；其女谢道韫、其子谢玄皆为江左人物之选。',
      source: '《晋书·谢奕传》' },
    { id: 'xie_wan', name: '谢万', zi: '万石', born: '', died: '361', gen: 3, family: 'chenjun_xie',
      title: '豫州刺史、西中郎将',
      desc: '谢安之弟。升平三年北伐，矜豪傲物、不抚士卒，未战而溃，废为庶人；谢安自此始有出仕之志。',
      source: '《晋书·谢万传》' },

  // ---------- DOM ----------

  // ---------- state ----------

  // ---------- utils ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function eraList(x) {
    if (Array.isArray(x.era)) return x.era;
    if (typeof x.era === 'string') return [x.era];
    return ['jin'];
  }
  function eraHas(x, e) {
    return eraList(x).indexOf(e) !== -1;
  }
  function yearOf(v) {
    const n = parseInt(String(v == null ? '' : v).replace(/[^0-9]/g, ''), 10);
    return isNaN(n) ? 9999 : n;
  }
  function lighten(hex, pct) {
    let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + Math.round((255 - r) * pct / 100));
    g = Math.min(255, g + Math.round((255 - g) * pct / 100));
    b = Math.min(255, b + Math.round((255 - b) * pct / 100));
    return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- build ----------
  // 椭圆等弧长取点：扁椭圆上等角度会让长轴两端过密，故按弧长均分
  function ellipseSlots(count, rx, ry) {
    const steps = 720;
    const cum = [0];
    let total = 0;
    for (let i = 1; i <= steps; i++) {
      const t0 = -Math.PI / 2 + (i - 1) / steps * Math.PI * 2;
      const t1 = -Math.PI / 2 + i / steps * Math.PI * 2;
      total += Math.hypot(
        (Math.cos(t1) - Math.cos(t0)) * rx,
        (Math.sin(t1) - Math.sin(t0)) * ry
      );
      cum.push(total);
    }
    const out = [];
    for (let k = 0; k < count; k++) {
      const target = total * k / count;
      let lo = 0, hi = steps;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] < target) lo = mid + 1; else hi = mid;
      }
      out.push(-Math.PI / 2 + (lo / steps) * Math.PI * 2);
    }
    return out;
  }

  // 判断一条血缘关系是否为「父 → 子」的世系连线（父子/父女/养父子/祖孙/曾祖孙）
  function isDescentLabel(label) {
    const s = String(label || '');
    return /^(养|族|继)?父(子|女)/.test(s) || /祖孙|曾祖孙/.test(s);
  }

  function buildGraph() {
    nodes = []; links = []; nodeById.clear();

    const cx = W / 2, cy = H / 2;
    const rx = W * 0.40, ry = H * 0.35;
    const fams = FAMILIES.filter(f => eraHas(f, era));
    const famIds = new Set(fams.map(f => f.id));
    const scope = PEOPLE.filter(p => eraHas(p, era) && famIds.has(p.family));
    const slots = ellipseSlots(fams.length, rx, ry);
    const byFamily = new Map();
    scope.forEach(p => {
      if (!byFamily.has(p.family)) byFamily.set(p.family, []);
      byFamily.get(p.family).push(p);
    });

    fams.forEach((f, fi) => {
      const ang = slots[fi];
      const fx = cx + Math.cos(ang) * rx;
      const fy = cy + Math.sin(ang) * ry;
      const fnode = {
        kind: 'family', id: f.id, name: f.name, color: f.color, seat: f.seat, era: f.eraLabel || '',
        desc: f.desc, highlights: f.highlights,
        x: fx, y: fy, ax: fx, ay: fy, r: 34, fixed: true
      };
      nodes.push(fnode);
      nodeById.set(fnode.id, fnode);

      const members = (byFamily.get(f.id) || []).slice().sort((p, q) =>
        (p.gen - q.gen) || (yearOf(p.born) - yearOf(q.born)) || (p.name < q.name ? -1 : 1)
      );
      const ring1Count = Math.min(members.length, 5);
      const ring2Count = members.length - ring1Count;

      members.forEach((p, i) => {
        let dist, a;
        const phase = fi * 0.55;
        if (i < ring1Count) {
          dist = 62;
          a = ang + (i / ring1Count) * Math.PI * 2 + phase;
        } else {
          const k = i - ring1Count;
          dist = 106;
          a = ang + ((k + 0.5) / Math.max(ring2Count, 1)) * Math.PI * 2 + phase;
        }
        const px = fx + Math.cos(a) * dist;
        const py = fy + Math.sin(a) * dist;
        const len = p.name.length;
        const r = len >= 4 ? 20 : (len === 3 ? 18 : 15.5);
        const node = {
          kind: 'person', id: p.id, name: p.name, zi: p.zi, born: p.born, died: p.died,
          title: p.title, desc: p.desc, source: p.source, family: p.family, gen: p.gen,
          x: px, y: py, ax: px, ay: py, r, fixed: false
        };
        nodes.push(node);
        nodeById.set(node.id, node);
      });
    });

    RELATIONS.forEach(rel => {
      const s = nodeById.get(rel.a), t = nodeById.get(rel.b);
      if (!s || !t) return;
      links.push({ source: s, target: t, type: rel.type, label: rel.label || '', bend: 0 });
    });

    scope.forEach(p => {
      const person = nodeById.get(p.id);
      const fam = nodeById.get(p.family);
      if (person && fam) {
        links.push({ source: person, target: fam, type: 'tie', label: fam.name + '成员', bend: 0 });
      }
    });

    // 同一对节点之间的多重关系，用弧度错开
    const groups = new Map();
    links.forEach(l => {
      const key = [l.source.id, l.target.id].sort().join('|');
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(l);
    });
    groups.forEach(arr => {
      if (arr.length < 2) return;
      arr.forEach((l, i) => { l.bend = (i - (arr.length - 1) / 2) * 30; });
    });
  }

  // ---------- layout ----------
  const LINK_LEN = { kin: 92, marriage: 130 };

  function relax(iterations) {
    const n = nodes.length;
    let maxMove = 0;
    for (let it = 0; it < iterations; it++) {
      const snap = new Array(n);
      for (let i = 0; i < n; i++) snap[i] = { x: nodes[i].x, y: nodes[i].y };

      for (let i = 0; i < n; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < n; j++) {
          const b = nodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 0.0001) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = dx * dx + dy * dy; }
          const d = Math.sqrt(d2);
          const min = a.r + b.r + 9;
          if (d < min) {
            const push = (min - d) * 0.42;
            const ux = dx / d, uy = dy / d;
            if (!a.fixed) { a.x -= ux * push; a.y -= uy * push; }
            if (!b.fixed) { b.x += ux * push; b.y += uy * push; }
          }
        }
      }

      for (let i = 0; i < links.length; i++) {
        const l = links[i];
        if (l.type === 'tie') continue;
        const s = l.source, t = l.target;
        let dx = t.x - s.x, dy = t.y - s.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const ideal = LINK_LEN[l.type] || 130;
        const k = (s.family && s.family === t.family) ? 0.012 : 0.0007;
        const f = (d - ideal) / d * k;
        const fx = dx * f, fy = dy * f;
        if (!s.fixed) { s.x += fx; s.y += fy; }
        if (!t.fixed) { t.x -= fx; t.y -= fy; }
      }

      // 环向约束：族人始终挂在家族节点周围的环上，簇不会被连线拉塌
      for (let i = 0; i < n; i++) {
        const nd = nodes[i];
        if (nd.fixed || nd.kind !== 'person' || !nd.ring) continue;
        const hub = nodeById.get(nd.family);
        if (!hub) continue;
        const dx = nd.x - hub.x, dy = nd.y - hub.y;
        const d = Math.hypot(dx, dy) || 1;
        const f = (d - nd.ring) * 0.09;
        nd.x -= dx / d * f;
        nd.y -= dy / d * f;
      }

      for (let i = 0; i < n; i++) {
        const nd = nodes[i];
        if (nd.fixed) continue;
        nd.x += (nd.ax - nd.x) * 0.06;
        nd.y += (nd.ay - nd.y) * 0.06;
      }

      let m = 0;
      for (let i = 0; i < n; i++) {
        m = Math.max(m, Math.abs(nodes[i].x - snap[i].x), Math.abs(nodes[i].y - snap[i].y));
      }
      maxMove = m;
    }
    return maxMove;
  }

  function fitView() {
    if (!nodes.length) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    nodes.forEach(nd => {
      minX = Math.min(minX, nd.x - nd.r - 26);
      maxX = Math.max(maxX, nd.x + nd.r + 26);
      minY = Math.min(minY, nd.y - nd.r - 22);
      maxY = Math.max(maxY, nd.y + nd.r + 22);
    });
    const bw = Math.max(maxX - minX, 1), bh = Math.max(maxY - minY, 1);
    const z = Math.max(0.3, Math.min(1.5, Math.min((W - 48) / bw, (H - 48) / bh)));
    view.zoom = z;
    view.x = (W - bw * z) / 2 - minX * z;
    view.y = (H - bh * z) / 2 - minY * z;
  }

  function kickLayout(iterations) {
    needsRelax = true;
    relaxBudget = Math.max(relaxBudget, iterations || 200);
  }

  // ---------- focus helpers ----------
  function computeFocusSet() {
    if (!focusFamily) return null;
    const set = new Set([focusFamily]);
    nodes.forEach(n => { if (n.kind === 'person' && n.family === focusFamily) set.add(n.id); });
    const snapshot = Array.from(set);
    snapshot.forEach(id => {
      links.forEach(l => {
        if (l.type === 'tie' || FACE_OF[l.type] !== face) return;
        if (l.source.id === id && l.target.kind === 'person') set.add(l.target.id);
        if (l.target.id === id && l.source.kind === 'person') set.add(l.source.id);
      });
    });
    Array.from(set).forEach(id => {
      const nd = nodeById.get(id);
      if (nd && nd.kind === 'person') set.add(nd.family);
    });
    return set;
  }

  function neighborhoodIds(node) {
    const set = new Set([node.id]);
    if (node.kind === 'person') set.add(node.family);
    if (node.kind === 'family') nodes.forEach(n => { if (n.kind === 'person' && n.family === node.id) set.add(n.id); });
    links.forEach(l => {
      if (l.type === 'tie' || FACE_OF[l.type] !== face) return;
      if (l.source === node) set.add(l.target.id);
      if (l.target === node) set.add(l.source.id);
    });
    return set;
  }

  // ---------- drawing ----------
  function controlPoint(l) {
    const sx = l.source.x, sy = l.source.y, tx = l.target.x, ty = l.target.y;
    let cx = (sx + tx) / 2, cy = (sy + ty) / 2;
    if (l.bend) {
      const dx = tx - sx, dy = ty - sy;
      const len = Math.hypot(dx, dy) || 1;
      cx += (-dy / len) * l.bend;
      cy += (dx / len) * l.bend;
    }
    return { x: cx, y: cy };
  }

  function pointOnCurve(l, t) {
    const c = controlPoint(l);
    const mt = 1 - t;
    return {
      x: mt * mt * l.source.x + 2 * mt * t * c.x + t * t * l.target.x,
      y: mt * mt * l.source.y + 2 * mt * t * c.y + t * t * l.target.y
    };
  }

  // 所有连线统一为二次贝塞尔，取点与渲染保持同一套几何
  function pointOnLink(l, t) {
    return pointOnCurve(l, t);
  }

  function drawNodeText(text, fontSize, weight, color) {
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const chars = Array.from(text);
    if (chars.length <= 3) {
      ctx.font = weight + ' ' + fontSize + 'px "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif';
      ctx.fillText(text, 0, 0.5);
    } else {
      const mid = chars.length === 5 ? 2 : Math.ceil(chars.length / 2);
      ctx.font = weight + ' ' + (fontSize - 1) + 'px "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif';
      const lh = fontSize * 0.58;
      ctx.fillText(chars.slice(0, mid).join(''), 0, -lh);
      ctx.fillText(chars.slice(mid).join(''), 0, lh);
    }
  }

  function wrapLabel(text, max) {
    const out = [];
    for (let i = 0; i < text.length; i += max) out.push(text.slice(i, i + max));
    return out;
  }

  function drawEdgeLabel(l) {
    if (!l.label) return;
    const p = pointOnLink(l, 0.5);
    const lines = wrapLabel(l.label, 22);
    const fs = 11;
    ctx.save();
    ctx.font = fs + 'px "Noto Serif SC", "Songti SC", serif';
    let w = 0;
    lines.forEach(s => { w = Math.max(w, ctx.measureText(s).width); });
    const padX = 8, lh = 16;
    const boxW = w + padX * 2, boxH = lines.length * lh + 9;
    const x = p.x - boxW / 2, y = p.y - boxH / 2;
    ctx.globalAlpha = 0.97;
    ctx.fillStyle = 'rgba(255,249,241,0.97)';
    ctx.strokeStyle = TYPE[l.type].color;
    ctx.lineWidth = 1.1 / Math.max(view.zoom, 0.6);
    roundRect(x, y, boxW, boxH, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = TYPE[l.type].color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((s, i) => {
      ctx.fillText(s, p.x, y + 4.5 + lh / 2 + i * lh);
    });
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const focusSet = computeFocusSet();
    const selSet = selected ? neighborhoodIds(selected) : null;
    const hasMatch = matches.size > 0;

    // 当前图面上有连线的节点；B面里只有亲缘关系的人物会淡出
    const activeIds = new Set();
    links.forEach(l => {
      if (l.type === 'tie' || FACE_OF[l.type] !== face) return;
      activeIds.add(l.source.id);
      activeIds.add(l.target.id);
    });

    ctx.save();
    ctx.translate(view.x, view.y);
    ctx.scale(view.zoom, view.zoom);

    const lineScale = 1 / Math.max(view.zoom, 0.6);

    // ---- links ----
    links.forEach(l => {
      const isTie = l.type === 'tie';
      if (!isTie && FACE_OF[l.type] !== face) return;
      let alpha = isTie ? 0.5 : 1;
      let width = isTie ? 1 : 1.5;

      if (focusSet && !(focusSet.has(l.source.id) && focusSet.has(l.target.id))) alpha *= 0.1;
      if (selSet && !(selSet.has(l.source.id) && selSet.has(l.target.id))) alpha *= 0.14;

      const touchHover = hoverNode && (l.source === hoverNode || l.target === hoverNode);
      if (touchHover) { alpha = Math.min(1, alpha + 0.5); width += 0.9; }
      if (l === hoverLink) { alpha = 1; width += 1.2; }
      if (qaHits.size) {
        const inQA = qaHits.has(l.source.id) && qaHits.has(l.target.id);
        if (!inQA) alpha *= 0.08;
      }
      if (qaHits.size && qaHits.has(l.source.id) && qaHits.has(l.target.id)) {
        alpha = Math.min(1, alpha + 0.35);
        width += 0.6;
      }

      if (alpha <= 0.02) return;

      const c = controlPoint(l);
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.strokeStyle = TYPE[l.type].color;
      ctx.lineWidth = width * lineScale;
      ctx.setLineDash(TYPE[l.type].dash.map(v => v * lineScale));
      ctx.beginPath();
      ctx.moveTo(l.source.x, l.source.y);
      ctx.quadraticCurveTo(c.x, c.y, l.target.x, l.target.y);
      ctx.stroke();
      ctx.setLineDash([]);
    });

    if (hoverLink && hoverLink.type !== 'tie') drawEdgeLabel(hoverLink);
    ctx.globalAlpha = 1;

    // ---- nodes ----
    nodes.forEach(nd => {
      const isHover = hoverNode === nd;
      const isSel = selected === nd;
      let alpha = 1;
      if (nd.kind === 'person' && !activeIds.has(nd.id)) alpha = 0.3;
      if (focusSet && !focusSet.has(nd.id)) alpha = 0.13;
      if (selSet && !selSet.has(nd.id)) alpha = Math.min(alpha, 0.2);
      if (hasMatch && !matches.has(nd.id)) alpha = Math.min(alpha, 0.16);
      if (hasMatch && matches.has(nd.id)) alpha = 1;
      if (qaHits.size && !qaHits.has(nd.id)) alpha = Math.min(alpha, 0.10);
      if (qaHits.size && qaHits.has(nd.id)) alpha = 1;
      if (isHover || isSel) alpha = 1;
      if (alpha <= 0.03) return;

      const scale = isHover ? 1.12 : 1;

      ctx.save();
      ctx.translate(nd.x, nd.y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;

      if (nd.kind === 'family') {
        const grad = ctx.createRadialGradient(-nd.r * 0.3, -nd.r * 0.35, nd.r * 0.12, 0, 0, nd.r);
        grad.addColorStop(0, lighten(nd.color, 30));
        grad.addColorStop(1, nd.color);
        ctx.beginPath();
        ctx.arc(0, 0, nd.r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(60, 40, 25, 0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
        drawNodeText(nd.name, 12.5, '700', '#FFF9F1');
      } else {
        const fc = FAMILY_COLOR[nd.family] || '#8B7662';
        ctx.beginPath();
        ctx.arc(0, 0, nd.r, 0, Math.PI * 2);
        ctx.fillStyle = isHover ? lighten(fc, 45) : '#FFF9F1';
        ctx.fill();
        ctx.strokeStyle = fc;
        ctx.lineWidth = 2.2;
        ctx.stroke();
        drawNodeText(nd.name, nd.name.length >= 4 ? 11 : (nd.name.length === 3 ? 11.5 : 13), '600', fc);
      }

      // 选中环
      if (isSel) {
        ctx.beginPath();
        ctx.arc(0, 0, nd.r + 4.5, 0, Math.PI * 2);
        ctx.strokeStyle = '#C96F3D';
        ctx.lineWidth = 2.4;
        ctx.setLineDash([]);
        ctx.stroke();
      }
      if (qaHits.has(nd.id)) {
        ctx.beginPath();
        ctx.arc(0, 0, nd.r + 10, 0, Math.PI * 2);
        ctx.strokeStyle = '#C96F3D';
        ctx.lineWidth = 1.6;
        ctx.setLineDash([3, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      // 检索命中环
      if (matches.has(nd.id)) {
        ctx.beginPath();
        ctx.arc(0, 0, nd.r + 7, 0, Math.PI * 2);
        ctx.strokeStyle = '#B8973A';
        ctx.lineWidth = 1.6;
        ctx.setLineDash([4, 3]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.restore();
    });

    ctx.restore();
  }

  // ---------- hit testing ----------
  function toWorld(sx, sy) {
    return { x: (sx - view.x) / view.zoom, y: (sy - view.y) / view.zoom };
  }

  function findNode(sx, sy) {
    const p = toWorld(sx, sy);
    const pad = 3 / view.zoom;
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const dx = p.x - n.x, dy = p.y - n.y;
      const rr = n.r + pad;
      if (dx * dx + dy * dy <= rr * rr) return n;
    }
    return null;
  }

  function findLink(sx, sy) {
    const p = toWorld(sx, sy);
    const tol = 7 / view.zoom;
    let best = null, bestD = Infinity;
    links.forEach(l => {
      if (l.type === 'tie' || FACE_OF[l.type] !== face) return;
      let prev = { x: l.source.x, y: l.source.y };
      for (let i = 1; i <= 12; i++) {
        const q = pointOnLink(l, i / 12);
        const dx = q.x - prev.x, dy = q.y - prev.y;
        const len2 = dx * dx + dy * dy || 1;
        let t = ((p.x - prev.x) * dx + (p.y - prev.y) * dy) / len2;
        t = Math.max(0, Math.min(1, t));
        const px = prev.x + dx * t, py = prev.y + dy * t;
        const d = Math.hypot(p.x - px, p.y - py);
        if (d < bestD) { bestD = d; best = l; }
        prev = q;
      }
    });
    return bestD <= tol ? best : null;
  }

  // ---------- detail panel ----------
  function lifeText(n) {
    if (n.born && n.died) return n.born + ' — ' + n.died;
    if (n.born) return n.born + ' — ？';
    if (n.died) return '？ — ' + n.died;
    return '';
  }

  function section(title, body) {
    return '<div class="detail-section"><h3>' + title + '</h3>' + body + '</div>';
  }

  function relItems(node, arr) {
    return arr.map(l => {
      const other = l.source === node ? l.target : l.source;
      const t = TYPE[l.type] || TYPE.kin;
      return '<li><span class="rel-type" style="color:' + t.color + '">' + t.name + '</span>' +
        '<button class="link-btn" data-id="' + other.id + '">' + esc(other.name) + '</button>' +
        (l.label ? '　' + esc(l.label) : '') + '</li>';
    }).join('');
  }

  // 家族世系：侧栏里按「一代一行」排布，同辈同高，子侄居下一层
  function familyTreeHTML(famId, hits) {
    const hitSet = hits || null;
    const color = FAMILY_COLOR[famId] || '#8B7662';
    const members = PEOPLE.filter(p => p.family === famId && nodeById.has(p.id));
    if (!members.length) return '';
    const byId = new Map(members.map(p => [p.id, p]));

    // 父系相承的边：决定子辈落在父辈正下方
    const parentOf = new Map();
    RELATIONS.forEach(r => {
      if (!isDescentLabel(r.label)) return;
      const a = byId.get(r.a), b = byId.get(r.b);
      if (!a || !b || a.gen === b.gen) return;
      const par = a.gen < b.gen ? a : b;
      const ch = a.gen < b.gen ? b : a;
      if (!parentOf.has(ch.id)) parentOf.set(ch.id, par.id);
    });

    // 叔侄等低一辈的旁系，用虚线补充
    const unclePairs = [];
    RELATIONS.forEach(r => {
      if (r.type !== 'kin' || !/叔侄|从父子/.test(r.label || '')) return;
      const a = byId.get(r.a), b = byId.get(r.b);
      if (!a || !b || a.gen === b.gen) return;
      const elder = a.gen < b.gen ? a : b;
      const younger = a.gen < b.gen ? b : a;
      unclePairs.push([elder.id, younger.id]);
    });

    const gens = Array.from(new Set(members.map(p => p.gen))).sort((a, b) => a - b);
    const VW = 520, GUT = 34, PAD_R = 8, ROWH = 64, NH = 26, TOP = 24;
    const contentW = VW - GUT - PAD_R;
    const CN = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    const nodeW = p => (p.name.length >= 4 ? 68 : (p.name.length === 3 ? 56 : 42));

    const pos = new Map();
    const rowY = new Map();
    const rows = gens.map((g, gi) => {
      const y = TOP + gi * ROWH;
      rowY.set(g, y);
      const sameRow = members.filter(p => p.gen === g);
      const slot = contentW / Math.max(1, sameRow.length);

      // 有父可依者排在父辈正下方，其余均分
      const items = sameRow.map((p, i) => {
        const pid = parentOf.get(p.id);
        return { p, ideal: pid && pos.has(pid) ? pos.get(pid) : GUT + slot * (i + 0.5) };
      });
      items.sort((a, b) => (a.ideal - b.ideal) ||
        (yearOf(a.p.born) - yearOf(b.p.born)) || (a.p.name < b.p.name ? -1 : 1));

      let cursor = GUT;
      items.forEach(it => {
        const w = nodeW(it.p);
        it.x = Math.max(cursor + w / 2, it.ideal);
        cursor = it.x + w / 2 + 10;
      });

      // 右侧溢出则整体回收，再从右往左推一遍
      const overflow = cursor - 10 - (VW - PAD_R);
      if (overflow > 0) {
        items.forEach(it => { it.x -= overflow; });
        let right = VW - PAD_R;
        for (let i = items.length - 1; i >= 0; i--) {
          const w = nodeW(items[i].p);
          items[i].x = Math.max(GUT + w / 2, Math.min(items[i].x, right - w / 2));
          right = items[i].x - w / 2 - 10;
        }
      }

      items.forEach(it => pos.set(it.p.id, it.x));
      return { g, y, arr: items.map(it => it.p) };
    });

    const H2 = TOP + Math.max(0, rows.length - 1) * ROWH + NH / 2 + 14;
    let s = '<svg viewBox="0 0 ' + VW + ' ' + H2 + '" role="img" aria-label="家族世系图">';

    rows.forEach(r => {
      s += '<line class="ft-guide" x1="' + GUT + '" y1="' + r.y + '" x2="' + (VW - PAD_R) + '" y2="' + r.y + '"/>';
      s += '<text class="ft-gen-label" x="0" y="' + (r.y + 3.5) + '">' + (CN[r.g] || r.g) + '世</text>';
    });

    // 叔侄旁系：淡虚线
    unclePairs.forEach(pair => {
      const [pid, cid] = pair;
      if (!pos.has(pid) || !pos.has(cid)) return;
      const par = byId.get(pid);
      const x1 = pos.get(pid), y1 = rowY.get(par.gen) + NH / 2 - 2;
      const x2 = pos.get(cid), y2 = rowY.get(byId.get(cid).gen) - NH / 2 + 2;
      const dy = Math.max(16, (y2 - y1) * 0.5);
      const hitU = hitSet && hitSet.has(pid) && hitSet.has(cid);
      s += '<path class="ft-edge ft-uncle' + (hitU ? ' ft-hit' : '') + '" stroke="' + color + '" d="M' +
        x1.toFixed(1) + ' ' + y1.toFixed(1) + ' C' + x1.toFixed(1) + ' ' + (y1 + dy).toFixed(1) + ' ' +
        x2.toFixed(1) + ' ' + (y2 - dy).toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
    });

    // 父系相承：实线
    rows.forEach(r => {
      r.arr.forEach(p => {
        const pid = parentOf.get(p.id);
        if (!pid || !pos.has(pid)) return;
        const par = byId.get(pid);
        const x1 = pos.get(pid), y1 = rowY.get(par.gen) + NH / 2 - 2;
        const x2 = pos.get(p.id), y2 = rowY.get(p.gen) - NH / 2 + 2;
        const dy = Math.max(16, (y2 - y1) * 0.5);
        const hitP = hitSet && hitSet.has(pid) && hitSet.has(p.id);
        s += '<path class="ft-edge ft-parent' + (hitP ? ' ft-hit' : '') + '" stroke="' + color + '" stroke-opacity="0.55" stroke-width="1.5" d="M' +
          x1.toFixed(1) + ' ' + y1.toFixed(1) + ' C' + x1.toFixed(1) + ' ' + (y1 + dy).toFixed(1) + ' ' +
          x2.toFixed(1) + ' ' + (y2 - dy).toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
      });
    });

    rows.forEach(r => {
      r.arr.forEach(p => {
        const x = pos.get(p.id);
        const len = p.name.length;
        const w = len >= 4 ? 68 : (len === 3 ? 56 : 42);
        const hitN = hitSet && hitSet.has(p.id);
        s += '<g class="ft-node' + (hitN ? ' ft-hit' : '') + '" data-id="' + p.id + '">';
        s += '<title>' + esc(p.name) + (p.zi ? '　字' + esc(p.zi) : '') + (p.title ? '　' + esc(p.title) : '') + '</title>';
        s += '<rect x="' + (x - w / 2).toFixed(1) + '" y="' + (r.y - NH / 2) + '" width="' + w + '" height="' + NH +
          '" rx="13" fill="#FFF9F1" stroke="' + color + '" stroke-width="1.2"/>';
        s += '<text x="' + x.toFixed(1) + '" y="' + (r.y + 4) + '" text-anchor="middle" font-size="' +
          (len >= 4 ? 10.5 : 11.5) + '" fill="#31251B">' + esc(p.name) + '</text>';
        s += '</g>';
      });
    });

    s += '</svg>';
    return '<div class="family-tree' + (hitSet && hitSet.size ? ' has-hit' : '') + '">' + s + '</div>' +
      '<div class="ft-note">共 ' + rows.length + ' 代 · ' + members.length + ' 位。同一横排为同辈，实线为父系相承，虚线为叔侄等低一辈旁系；点击姓名可查看其人。</div>';
  }

  function renderDetail(node) {
    const isFam = node.kind === 'family';
    const color = isFam ? node.color : (FAMILY_COLOR[node.family] || '#8B7662');
    let html = '';

    html += '<div class="detail-name">' + esc(node.name);
    if (!isFam && node.zi) html += '<span class="detail-zi">字 ' + esc(node.zi) + '</span>';
    html += '</div>';

    html += '<button class="detail-family-tag" data-id="' + (isFam ? node.id : node.family) + '" style="background:' + color + '">' +
      (isFam ? '门阀家族' : esc(FAMILY_NAME[node.family] || '')) + '</button>';
    html += '<div class="face-note">当前图面：' + FACE_LABEL[face] + '</div>';

    if (isFam) {
      html += section('简介', '<p>' + esc(node.desc) + '</p>');
      html += section('郡望', '<p>' + esc(node.seat) + '</p>');
      html += section('活跃时期', '<p>' + esc(node.era) + '</p>');
      const treeHits = (qaTreeFam === node.id && qaTreeHits.size) ? qaTreeHits : null;
      html += section('家族世系', familyTreeHTML(node.id, treeHits));
      if (node.highlights && node.highlights.length) {
        html += section('家族要略', '<ul>' + node.highlights.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul>');
      }
      const members = PEOPLE.filter(p => p.family === node.id && nodeById.has(p.id));

      if (face === 'a') {
        // 由族人的婚姻关系反推姻亲家族
        const marrFams = [];
        members.forEach(p => {
          links.forEach(l => {
            if (l.type !== 'marriage') return;
            let other = null;
            if (l.source.id === p.id) other = l.target;
            else if (l.target.id === p.id) other = l.source;
            if (other && other.kind === 'person' && other.family !== node.id && marrFams.indexOf(other.family) === -1) {
              marrFams.push(other.family);
            }
          });
        });
        if (marrFams.length) {
          html += section('姻亲家族',
            '<div class="chips">' + marrFams.map(id =>
              '<button class="chip" data-id="' + id + '" style="border-color:' + FAMILY_COLOR[id] + ';color:' + FAMILY_COLOR[id] + '">' + FAMILY_NAME[id] + '</button>'
            ).join('') + '</div>');
        } else {
          html += section('姻亲家族', '<p class="family-lead">暂无可考的直接姻亲关系。</p>');
        }
      } else {
        const famRels = links.filter(l => l.type !== 'tie' && FACE_OF[l.type] === face && (l.source === node || l.target === node));
        if (famRels.length) {
          html += section('对外格局', '<ul>' + relItems(node, famRels) + '</ul>');
        } else {
          html += section('对外格局', '<p class="family-lead">本面暂无家族层面的关系记录。</p>');
        }
      }
    } else {
      const life = lifeText(node);
      if (life) html += section('生卒', '<p>' + esc(life) + '</p>');
      if (node.title) html += section('官职', '<p>' + esc(node.title) + '</p>');
      if (node.desc) html += section('简介', '<p>' + esc(node.desc) + '</p>');
      if (node.source) html += section('史料', '<p class="family-lead">' + esc(node.source) + '</p>');

      const rels = links.filter(l => l.type !== 'tie' && FACE_OF[l.type] === face && (l.source === node || l.target === node));

      if (face === 'a') {
        const kin = rels.filter(r => r.type === 'kin');
        const marr = rels.filter(r => r.type === 'marriage');
        if (kin.length) html += section('亲属', '<ul>' + relItems(node, kin) + '</ul>');
        if (marr.length) html += section('姻亲', '<ul>' + relItems(node, marr) + '</ul>');
        if (!rels.length) html += section('关系', '<p class="family-lead">本面暂无可考的血缘、姻亲记录。</p>');
      } else {
        const groups = [['alliance', '政治同盟'], ['conflict', '对立'], ['recommend', '举荐 / 师承'], ['friend', '交游']];
        let printed = 0;
        groups.forEach(g => {
          const arr = rels.filter(r => r.type === g[0]);
          if (arr.length) { html += section(g[1], '<ul>' + relItems(node, arr) + '</ul>'); printed += arr.length; }
        });
        if (!printed) html += section('关系', '<p class="family-lead">本面暂无交游、政治关系记录。</p>');
      }
    }

    detailContent.innerHTML = html;
    panel.classList.toggle('wide', isFam);
    panel.classList.add('open');
  }

  function selectNode(node, center) {
    if (!(node.kind === 'family' && qaTreeFam === node.id)) { qaTreeHits = new Set(); qaTreeFam = null; }
    selected = node;
    renderDetail(node);
    panel.scrollTop = 0;
    if (center) centerOn(node);
  }

  function centerOn(node) {
    const z = Math.max(view.zoom, 0.95);
    view.zoom = z;
    // 右侧详情面板会遮住画布，目标点放在可见区偏左
    view.x = W * 0.38 - node.x * z;
    view.y = H / 2 - node.y * z;
  }

  // ---------- interaction ----------
  function localPoint(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('mousedown', e => {

  // ---------- 自然语言问答（本地检索，无外部请求） ----------
  const askLog = document.getElementById('askLog');

  const QP = new Map(PEOPLE.map(p => [p.id, p]));
  const QF = new Map(FAMILIES.map(f => [f.id, f]));
  const CN_NUM = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];

  function qaName(id) {

  function qaTypeName(t) { return (TYPE[t] && TYPE[t].name) || ''; }
